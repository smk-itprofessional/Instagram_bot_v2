niche: "daily motivation"
handle: "@fuel.by.karna"
width: 1080
height: 1350

# FIX 1: added {pillar} so image mood matches quote pillar (hope/discipline/etc)
image_prompt_template: "cinematic motivational {theme}, {pillar} mood, {niche}, ultra detailed, vibrant, inspiring atmosphere, no text watermark"

# FIX 2: added {pillar} so caption shows Day N + pillar (was missing)
caption_template: "{quote}\n\nDay {day_of_year}/365 • {pillar} ✨\n{hashtags}"

# FIX 3: replaced static hashtags: with viral switcher system
# base = always included (brand + 2 big)
base_hashtags:
  - "#fuelbykarna"
  - "#motivation"
  - "#dailyquotes"

# pillar-specific — auto-switched by JSON pillar
pillar_hashtags:
  discipline: ["#discipline", "#selfdiscipline", "#consistency", "#habits", "#focusmode"]
  courage: ["#courage", "#bebrave", "#fearless", "#confidence", "#bravehearts"]
  perseverance: ["#perseverance", "#nevergiveup", "#keepgoing", "#grit", "#resilience"]
  focus: ["#focus", "#deepwork", "#clarity", "#mindsetmatters", "#distractionfree"]
  beginnings: ["#newbeginnings", "#freshstart", "#dayone", "#startnow", "#comeback"]
  gratitude: ["#gratitude", "#thankful", "#blessed", "#positivity", "#mindfulness"]
  growth: ["#growth", "#growthmindset", "#selfgrowth", "#levelup", "#learnmore"]
  hope: ["#hope", "#faith", "#believe", "#staypositive", "#lightwithin"]
  action: ["#takeaction", "#justdoit", "#hustle", "#execution", "#dowork"]
  character: ["#character", "#integrity", "#values", "#honor", "#bebetter"]

# viral rotating pool — 5 picked per day deterministically
viral_pool:
  - "#viralquotes"
  - "#explorepage"
  - "#reelsinstagram"
  - "#motivationalquotes"
  - "#successquotes"
  - "#inspirationdaily"
  - "#mindsetquotes"
  - "#lifelessons"
  - "#selfimprovement"
  - "#disciplinedlife"
  - "#morningmotivation"
  - "#quotesoftheday"
  - "#instagramgrowth"
  - "#quoteoftheday"
viral_per_post: 5

# kept for backward compat, new code uses base_hashtags above
hashtags:
  - "#motivation"
  - "#dailyquotes"
  - "#mindset"

