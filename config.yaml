# daily.karna — motivational edition — 365 unique days, no repeat
niche: "motivational quotes with cinematic nature backgrounds"
width: 1080
height: 1350

caption_template: |
  {quote}

  ✨ Day {day_of_year}/365 — daily motivation

  Follow @fuel.by.karna for more 🙌
  .
  .
  .
  {hashtags}

hashtags:
  - "#motivation"
  - "#dailymotivation"
  - "#mindset"
  - "#inspiration"
  - "#success"
  - "#positivevibes"
  - "#goals"
  - "#discipline"
  - "#selfgrowth"
  - "#dailykarna"

image_prompt_template: "cinematic {niche}, ultra detailed, vibrant, high quality photography, no text watermark, no logo, theme: {theme}"

